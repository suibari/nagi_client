schema: spec-driven

context: |
  文書は日本語で記述し、OpenSpecの構造用見出し（Purpose / Requirements /
  Requirement / Scenario / WHEN / THEN）は英語を維持する。
  Nagi Webクライアントの既存仕様は openspec/specs/<domain>/spec.md にある。
  設計判断・実装経緯・互換条件の出典は同じ分野の design.md に保存する。
  基準化の対象と完了条件は openspec/README.md と coverage.md を参照する。
  現在は仕様書整備段階。アプリのコード、設定、依存関係、既存コメントは変更しない。
  コメント削減は別の依頼で行い、今回の文書化を削除許可とみなさない。
  既知の不整合は openspec/known-gaps.md に記録し、望ましい仕様へ黙って読み替えない。
  AppView・bot・lexiconは別リポジトリ。本リポジトリの記載だけで外部実装の検証済みを主張しない。

rules:
  proposal:
    - 対象分野、利用者の振る舞いの差分、非対象、影響する既存仕様を明記する。
    - 現状の基準化と将来の動作変更を混ぜない。
  design:
    - 判断の理由、互換性条件、失敗時の扱い、個人情報の境界、出典を記録する。
    - 不明な過去経緯は推測せず、確認できた事実と未確認事項を区別する。
  specs:
    - 観測可能な要件にMUSTまたはSHALLとWHEN/THENシナリオを付ける。
    - 正常系だけでなく権限不足・旧レスポンス・競合・アカウント切替を必要に応じて扱う。
    - design.mdの出典を失わず、コメントとの不整合はknown-gaps.mdにも記録する。
  tasks:
    - 仕様整備とコード変更を別タスクとして記述し、現在の文書化段階でコード変更を実行しない。
    - 検証結果は仕様形式、出典網羅性、動作テストのどれを確認したか明示する。
