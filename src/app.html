<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="icon" type="image/png" href="%sveltekit.assets%/nagi_icon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/nagi_icon.png" />

		<!-- PWA: ホーム画面追加で standalone 起動。iOS の Web Push は standalone 必須。 -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta id="nagi-theme-color" name="theme-color" content="#f4fafa" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Nagi" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Nagi" />
		<meta property="og:image" content="https://nagi.suibari.com/nagi_ogp.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Nagi（ナギ）— やさしい言葉が凪ぐ全肯定SNS" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://nagi.suibari.com/nagi_ogp.jpg" />
		<meta name="twitter:image:alt" content="Nagi（ナギ）— やさしい言葉が凪ぐ全肯定SNS" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebSite",
						"@id": "https://nagi.suibari.com/#website",
						"url": "https://nagi.suibari.com/",
						"name": "Nagi",
						"alternateName": ["Nagi（ナギ）", "全肯定SNS Nagi"],
						"inLanguage": "ja"
					},
					{
						"@type": "Organization",
						"@id": "https://nagi.suibari.com/#organization",
						"name": "Nagi",
						"url": "https://nagi.suibari.com/",
						"logo": {
							"@type": "ImageObject",
							"url": "https://nagi.suibari.com/nagi_icon.png"
						}
					}
				]
			}
		</script>

		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
